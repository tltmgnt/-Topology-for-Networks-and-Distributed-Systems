name: Synchronous network failure analysis CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_installed.py
      - run: python tests/check_researchos_installed.py
      - name: Synthetic evidence bundle
        if: matrix.python-version == '3.12'
        run: |
          mkdir -p runs
          network-topology analyze examples/reference.json --output runs/reference
          network-topology verify runs/reference
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.python-version == '3.12'
        with:
          name: synthetic-network-topology-review
          path: runs/reference/
          retention-days: 7
          if-no-files-found: error
