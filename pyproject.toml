[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nettop"
version = "0.1.0"
description = "Network topology, failure analysis, and distributed averaging models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
nettop = "nettop.__main__:main"

[tool.setuptools.packages.find]
include = ["nettop*"]
